<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-wc1I0wz50YqnR9oHXKNVb+P4+LUz/Gm35kk1JanTrGg='; connect-src 'self' https://api.elevenlabs.io; media-src blob:; img-src 'self' data:; style-src 'self'; base-uri 'none'; form-action 'none'">
  <title>narrated-guides</title>
  <link rel="stylesheet" href="style.css">
  <script type="importmap">{ "imports": { "jszip": "../vendor/jszip.mjs" } }</script>
  <script type="module" src="app.mjs"></script>
</head>
<body>
  <header>
    <div class="top">
      <p class="eyebrow">narrated-guides</p>
      <button type="button" class="link" id="lang" data-i18n="lang"></button>
    </div>
    <h1 data-i18n="h1"></h1>
    <p class="lede" data-i18n="lede"></p>
    <p class="privacy" data-i18n="privacy"></p>
  </header>

  <main>
    <section id="step-deck">
      <h2><span class="n">1</span> <span data-i18n="s1"></span></h2>
      <label class="drop" id="drop">
        <input type="file" id="file" accept=".pptx">
        <span data-i18n="drop"></span>
      </label>
      <p class="aside" data-i18n="sample"></p>
      <details class="help">
        <summary data-i18n="help-notes-summary"></summary>
        <div data-i18n="help-notes-body"></div>
      </details>
      <details class="help">
        <summary data-i18n="help-copilot-summary"></summary>
        <div data-i18n="help-copilot-body"></div>
      </details>
    </section>

    <section id="step-check" hidden>
      <h2><span class="n">2</span> <span data-i18n="s2"></span></h2>
      <p id="summary"></p>
      <ol id="slides" class="slides"></ol>
    </section>

    <section id="step-voices" hidden>
      <h2><span class="n">3</span> <span data-i18n="s3"></span></h2>
      <div class="field">
        <label for="key" data-i18n="key-label"></label>
        <div class="row">
          <input type="password" id="key" autocomplete="off" spellcheck="false" placeholder="sk_…">
          <button type="button" id="load-voices" data-i18n="load-voices"></button>
        </div>
        <label class="check"><input type="checkbox" id="remember"> <span data-i18n="remember"></span></label>
        <p class="aside" data-i18n="key-aside"></p>
      </div>
      <div id="voice-picks"></div>
      <details class="help">
        <summary data-i18n="voices-help-summary"></summary>
        <div data-i18n="voices-help-body"></div>
      </details>
      <details class="help">
        <summary data-i18n="advanced"></summary>
        <div class="field">
          <label for="model" data-i18n="model-label"></label>
          <input type="text" id="model" value="eleven_v4" spellcheck="false">
          <p class="aside" data-i18n="model-aside"></p>
        </div>
      </details>
    </section>

    <section id="step-make" hidden>
      <h2><span class="n">4</span> <span data-i18n="s4"></span></h2>
      <button type="button" id="make" class="primary" disabled data-i18n="make"></button>
      <p id="make-hint" class="aside"></p>
      <ol id="progress" class="progress"></ol>
      <div id="result" hidden>
        <a id="download" class="primary button" download data-i18n="download"></a>
        <div id="report"></div>
        <h3 data-i18n="then"></h3>
        <ol class="next" data-i18n="then-body"></ol>
      </div>
    </section>
  </main>

  <footer>
    <p data-i18n="footer"></p>
  </footer>
</body>
</html>
